<!DOCTYPE html>
<html>
<head>
    <title>Upload Profiles</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .upload-card {
            background: #ffffff;
            padding: 40px;
            width: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .upload-card h2 {
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }

        .upload-card input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .upload-card button {
            width: 100%;
            padding: 12px;
            background: #e5026b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .upload-card button:hover {
            background: #b71c1c;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="upload-wrapper">
    <div class="upload-card">
        <h2>Upload Profiles (Excel)</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.file }}
            <button type="submit">Upload File</button>
        </form>

        {% if messages %}
            {% for message in messages %}
                <div class="message 
                    {% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>
</div>

</body>
</html>
