<!DOCTYPE html>
<html>
<head>
    <title>Processing Payment...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .processing-box {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="processing-box">
        <h2>⏳ Processing Your Payment</h2>
        <div class="spinner"></div>
        <p>Please wait while we verify your payment...</p>
        <p style="font-size: 12px; margin-top: 20px;">Do not close this window</p>
    </div>
    
    <script>
        // Auto-submit the form if this page is loaded via GET
        window.addEventListener('load', function() {
            // If there's POST data in session storage, submit it
            const paymentData = sessionStorage.getItem('paymentData');
            if (paymentData) {
                const data = JSON.parse(paymentData);
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = "{% url 'mck_website:payment_callback' %}";
                
                // Add CSRF token
                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = 'csrfmiddlewaretoken';
                csrfInput.value = '{{ csrf_token }}';
                form.appendChild(csrfInput);
                
                // Add payment data
                Object.keys(data).forEach(key => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = key;
                    input.value = data[key];
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        });
    </script>
</body>
</html>
