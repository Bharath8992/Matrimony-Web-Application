{% load static %}

<!-- <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"> -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== HERO SECTION ===== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  color: #fff;
  overflow: hidden;
  isolation: isolate;
}

/* Desktop Background Image */
.hero__bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.hero__bg-desktop {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.hero__bg-mobile {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* No overlay */
.hero__overlay {
  display: none;
}

/* ===== LAYOUT ===== */
.hero__inner {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 5rem 2rem;
  display: flex;
  align-items: center;
  justify-content: flex-end; /* content pushed right */
}

/* ===== CONTENT BLOCK (Right Side, Center Aligned) ===== */
.hero__content {
  width: 100%;
  max-width: 560px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Eyebrow Tag */
.hero__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.8rem;
  font-weight: 300;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #020202;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.2s forwards;
}

.hero__eyebrow::before,
.hero__eyebrow::after {
  content: '';
  display: block;
  width: 36px;
  height: 1px;
  background: linear-gradient(to right, transparent, #f5c9dc);
}
.hero__eyebrow::after {
  background: linear-gradient(to left, transparent, #f5c9dc);
}



/* Subtitle */
.hero__subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.4rem, 2.5vw, 1.7rem);
  font-weight: 300;
  font-style: italic;
  line-height: 1.85;
  color: rgba(2, 2, 2, 0.88);
  max-width: 440px;
  margin: 1.5rem auto 2rem;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  opacity: 0;
  animation: fadeUp 0.9s ease 0.6s forwards;
}

.hero__subtitle .accent {
  color: #ffc6df;
  font-weight: 400;
  font-style: normal;
}

/* Divider */
.hero__divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 auto 2rem;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.72s forwards;
}

.hero__divider-line {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(255,182,217,0.7));
}
.hero__divider-line:last-child {
  background: linear-gradient(to left, transparent, rgba(255,182,217,0.7));
}

.hero__divider-icon {
  font-size: 1.1rem;
  color: #d4af37;
  animation: heartbeat 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 6px rgba(212,175,55,0.6));
}

/* CTA Buttons */
.hero__cta {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 0.9s ease 0.85s forwards;
  margin-bottom: 2.5rem;
}

.btn {
  padding: 0.85rem 2.2rem;
  border-radius: 50px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  cursor: pointer;
  border: none;
}

.btn-primary {
  background: linear-gradient(135deg, #ff4d8d 0%, #e60073 60%, #c0005f 100%);
  color: #fff;
  box-shadow: 0 8px 28px rgba(230,0,115,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-primary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 14px 36px rgba(230,0,115,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
  color: #fff;
  text-decoration: none;
}

.btn-outline {
  background: rgba(255,255,255,0.08);
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.65);
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.btn-outline:hover {
  background: rgba(255,255,255,0.95);
  color: #c0005f;
  border-color: rgba(255,255,255,0.95);
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(0,0,0,0.3);
  text-decoration: none;
}

/* Stats */
.hero__stats {
  display: flex;
  gap: 0;
  justify-content: center;
  background: rgba(10,0,20,0.35);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  backdrop-filter: blur(14px);
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.9s ease 1s forwards;
}

.stat {
  flex: 1;
  padding: 1.1rem 1.4rem;
  text-align: center;
  position: relative;
}

.stat + .stat::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: rgba(255,255,255,0.15);
}

.stat__number {
  font-family: 'Playfair Display', serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: #ffb6d9;
  line-height: 1;
  margin-bottom: 4px;
}

.stat__label {
  font-size: 0.72rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
}

/* ===== FLOATING DECORATIONS ===== */
.hero__petal {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50% 0 50% 0;
  background: rgba(255, 77, 141, 0.25);
  animation: floatPetal linear infinite;
  z-index: 2;
  pointer-events: none;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.18); }
}

@keyframes floatPetal {
  0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .hero__bg-desktop { display: none; }
  .hero__bg-mobile  { display: block; }

  .hero__overlay {
    display: none;
  }

  .hero__shimmer { display: none; }

  .hero__inner {
    justify-content: center;
    padding: 4rem 1.5rem 3rem;
    align-items: flex-end;
    min-height: 100vh;
  }

  .hero__content {
    max-width: 100%;
  }
}

@media (max-width: 480px) {
  .hero__cta {
    flex-direction: column;
    align-items: center;
  }
  .btn {
    width: 100%;
    justify-content: center;
  }
  .hero__stats {
    border-radius: 14px;
  }
  .stat__number {
    font-size: 1.4rem;
  }
}
</style>

<section class="hero">

  <!-- Background Images: Desktop + Mobile -->
  <div class="hero__bg">
    <!-- Replace src with {% static 'images/banner.jpg' %} for desktop -->
    <img class="hero__bg-desktop"
         src="{% static 'images/banner.jpg' %}"
         alt="Happy couple — desktop"
         fetchpriority="high">

    <!-- Replace src with {% static 'images/banner-mobile.jpg' %} for mobile -->
    <img class="hero__bg-mobile"
         src="{% static 'images/banner-mobile.jpg' %}"
         alt="Happy couple — mobile"
         fetchpriority="high">
  </div>

  <!-- Floating petals (decorative) -->
  <div class="hero__petal" style="left:68%;width:6px;height:6px;animation-duration:9s;animation-delay:0s;"></div>
  <div class="hero__petal" style="left:75%;width:10px;height:10px;animation-duration:13s;animation-delay:2s;"></div>
  <div class="hero__petal" style="left:82%;width:7px;height:7px;animation-duration:11s;animation-delay:4.5s;"></div>
  <div class="hero__petal" style="left:71%;width:5px;height:5px;animation-duration:8s;animation-delay:7s;"></div>

  <!-- Right-side centered content -->
  <div class="hero__inner">
    <div class="hero__content">

      <div class="hero__eyebrow">Matrimony &amp; Matchmaking</div>

       <img src="{% static "images/exp.png" %}"">

    


      {% if user.is_authenticated %}
      <div class="hero__cta">
        <a href="{% url 'mck_website:mck_property_page' %}" class="btn btn-primary">
          <i class="fas fa-search"></i> Find Matches
        </a>
      </div>
      {% else %}
      <div class="hero__cta">
        <a href="{% url 'mck_auth:website_signup' %}" class="btn btn-primary">
          <i class="fas fa-user-plus"></i> Join Free Today
        </a>
        <a href="{% url 'mck_auth:website_signin' %}" class="btn btn-outline">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </a>
      </div>
      {% endif %}

      <!-- Stats -->
        <div class="hero__stats">
          <div class="stat">
            <div class="stat__number">10K+</div>
            <div class="stat__label">Happy Couples</div>
          </div>
          <div class="stat">
            <div class="stat__number">50K+</div>
            <div class="stat__label">Active Profiles</div>
          </div>
          <div class="stat">
            {% if user.is_authenticated %}
            <div class="stat__number">100+</div>
            <div class="stat__label">Daily Matches</div>
            {% else %}
            <div class="stat__number">100%</div>
            <div class="stat__label">Verified</div>
            {% endif %}
          </div>
        </div>

    </div>
  </div>
</section>
